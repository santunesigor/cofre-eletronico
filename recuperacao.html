<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrassenha do cofre</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box} .camera{position:relative;overflow:hidden;border-radius:12px;background:#111}video{display:block;width:100%;max-height:55vh;object-fit:contain}.guide{position:absolute;top:39%;left:5%;width:90%;height:22%;border:2px solid #98f2b6;border-radius:6px;pointer-events:none;box-shadow:0 0 0 999px #0005} .buttons{display:grid;grid-template-columns:1fr 1fr;gap:.6rem} .status{min-height:1.5em;color:#43546b} button{cursor:pointer} input{border:1px solid #aaa;border-radius:8px} button{border:1px solid #aaa;border-radius:8px;background:#eef2f7} #start,#calc{background:#245b85;color:white;border:0} #photoLabel{display:block;padding:.65rem;border:1px solid #aaa;border-radius:8px;text-align:center;cursor:pointer} body{font:16px system-ui;max-width:32rem;margin:2rem auto;padding:0 1rem;color:#202329;background:#fafafa}label,input,button{display:block;margin:.7rem 0}input,button{font:inherit;padding:.75rem;box-sizing:border-box;width:100%}output{display:block;font:700 2.5rem monospace;letter-spacing:.15em;margin:1rem 0}small{color:#555}</style>
<h1>Contrassenha do cofre</h1><p>Calculador offline. Nenhum dado é transmitido.</p>
<label for="key">Chave secreta (16 dígitos)</label><input id="key" type="password" inputmode="numeric" maxlength="16" autocomplete="off">
<button id="gen" type="button">Gerar chave para primeira configuração</button><p id="newkey"></p>
<section aria-label="Leitor do LCD">
<button id="start" type="button">Escanear LCD com a câmera</button>
<div id="camera" class="camera" hidden><video id="video" playsinline muted></video><div class="guide"></div></div>
<button id="stop" type="button" hidden>Fechar câmera</button>
<label id="photoLabel" for="photo">Ler uma foto do LCD</label>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<p id="status" class="status" role="status" aria-live="polite">Aponte para a linha ID do LCD. A leitura é feita no dispositivo.</p>
</section>
<label for="id">ID mostrado no LCD (12 caracteres)</label><input id="id" maxlength="12" autocapitalize="characters" autocomplete="off">
<button id="calc" type="button">Calcular contrassenha</button>
<output id="result" aria-live="polite"></output><small>Use o ID atual. Ele muda a cada minuto. Depois de desbloquear, digite o PIN normal.</small>
<script>
"use strict";
const MASK=(1n<<64n)-1n;
const rot=(x,n)=>((x<<n)|(x>>(64n-n)))&MASK;
function sipHash8(key,m){
  const read=(p)=>{let r=0n;for(let i=0;i<8;i++)r|=BigInt(key.charCodeAt(p+i))<<BigInt(8*i);return r;};
  const k0=read(0),k1=read(8);
  let a=0x736f6d6570736575n^k0,b=0x646f72616e646f6dn^k1,c=0x6c7967656e657261n^k0,d=0x7465646279746573n^k1;
  function round(){a=(a+b)&MASK;b=rot(b,13n)^a;a=rot(a,32n);c=(c+d)&MASK;d=rot(d,16n)^c;a=(a+d)&MASK;d=rot(d,21n)^a;c=(c+b)&MASK;b=rot(b,17n)^c;c=rot(c,32n);}
  d^=m;round();round();a^=m;
  const end=8n<<56n;d^=end;round();round();a^=end;c^=255n;
  for(let i=0;i<4;i++)round();return a^b^c^d;
}
const el=id=>document.getElementById(id);
el("gen").onclick=()=>{
  let key="";const buf=new Uint8Array(32);
  while(key.length<16){crypto.getRandomValues(buf);for(const b of buf)if(b<250&&key.length<16)key+=String(b%10);}
  el("key").value=key;el("newkey").textContent="Guarde e cadastre esta chave: "+key;
  el("result").textContent="";
};
function calcular(){
  const k=el("key").value.trim(),id=el("id").value.trim();
  if(!/^\d{16}$/.test(k)||! /^[0-9a-fA-F]{12}$/.test(id)){el("result").textContent="Confira os dados.";return;}
  el("newkey").textContent="";
  el("result").textContent=String(sipHash8(k,BigInt("0x"+id))%1000000n).padStart(6,"0");
}
// Não converte letras parecidas em números: uma leitura incorreta gera código errado.
function extrairId(text) {
  const candidatos = new Set();
  for (const linha of text.toUpperCase().split(/\r?\n/)) {
    const compacta=linha.replace(/\s/g,"");
    const match=compacta.match(/^ID:([0-9A-F]{12})$/);
    if(match) candidatos.add(match[1]);
  }
  return candidatos.size===1?[...candidatos][0]:null;
}
el("calc").onclick=calcular;
function recalcular(){
  el("result").textContent="";
  if(/^\d{16}$/.test(el("key").value.trim())&&/^[0-9a-fA-F]{12}$/.test(el("id").value.trim())) calcular();
}
el("key").addEventListener("input",recalcular);
el("id").addEventListener("input",recalcular);
let stream=null,workerPromise=null,geracao=0,busy=false;
const status=msg=>{el("status").textContent=msg;};
function obterWorker(){
  if(!workerPromise) workerPromise=(async()=>{
    if(!window.Tesseract) {
      await new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        script.src="./ocr/tesseract.min.js";
        script.onload=resolve;
        script.onerror=()=>reject(new Error("Arquivos OCR ausentes. Use o pacote preparado ou execute npm run prepare:ocr."));
        document.head.append(script);
      });
    }
    const w=await Tesseract.createWorker("eng",1,{
      workerPath:new URL("./ocr/worker.min.js",location.href).href,
      corePath:new URL("./ocr/core",location.href).href,
      langPath:new URL("./ocr/lang",location.href).href,
      workerBlobURL:false
    });
    try {
      await w.setParameters({tessedit_pageseg_mode:"7",tessedit_char_whitelist:"ID:0123456789ABCDEF ",preserve_interword_spaces:"1"});
      return w;
    } catch(e){await w.terminate();throw e;}
  })().catch(e=>{workerPromise=null;throw e;});
  return workerPromise;
}
function encerrar(){
  ++geracao;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null;
  el("video").srcObject=null;
  el("camera").hidden=true;
  el("stop").hidden=true;
  el("start").disabled=busy;
}
function aceitar(id){
  el("id").value=id;
  recalcular();
  status(/^\d{16}$/.test(el("key").value.trim())?"ID lido. Confira os 12 caracteres no LCD antes de usar o código.":"ID lido. Digite a chave secreta para calcular automaticamente.");
}
// Recorta a linha central indicada pelo visor e amplia para melhorar a leitura.
function quadro(source,recortar){
  const w=source.videoWidth||source.naturalWidth;
  const h=source.videoHeight||source.naturalHeight;
  if(!w||!h)return null;
  const x=recortar?Math.round(w*.05):0,y=recortar?Math.round(h*.39):0;
  const sw=recortar?Math.round(w*.90):w,sh=recortar?Math.round(h*.22):h;
  const canvas=document.createElement("canvas");
  const scale=Math.min(3,1200/sw);
  canvas.width=Math.max(1,Math.round(sw*scale));canvas.height=Math.max(1,Math.round(sh*scale));
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.filter="grayscale(1) contrast(1.6)";
  ctx.drawImage(source,x,y,sw,sh,0,0,canvas.width,canvas.height);
  return canvas;
}
function pausa(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function iniciarCamera(){
  if(busy)return;
  busy=true;const token=++geracao;el("start").disabled=true;
  el("id").value="";el("result").textContent="";
  el("stop").hidden=false;
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("Abra em HTTPS ou localhost, ou use a opção de foto.");
    status("Permita a câmera e alinhe a primeira linha do LCD na moldura.");
    const nova=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    if(token!==geracao){nova.getTracks().forEach(t=>t.stop());return;}
    stream=nova;const video=el("video");video.srcObject=stream;
    el("camera").hidden=false;await video.play();
    status("Preparando leitor OCR...");
    const worker=await obterWorker();
    let anterior=null,acertos=0;
    while(token===geracao){
      const canvas=quadro(video,true);
      if(!canvas){await pausa(200);continue;}
      const {data}=await worker.recognize(canvas);
      if(token!==geracao)return;
      const id=extrairId(data.text);
      if(id&&id===anterior)acertos++;else{anterior=id;acertos=id?1:0;}
      if(acertos>=2){encerrar();aceitar(id);return;}
      status(id?"Confirmando leitura: "+id:"Alinhe ID: e os 12 caracteres na moldura, sem reflexos.");
      await pausa(300);
    }
  }catch(e){if(token===geracao){encerrar();status("Não foi possível escanear: "+e.message);}}
  finally{busy=false;el("start").disabled=false;}
}
el("start").onclick=iniciarCamera;
el("stop").onclick=()=>{encerrar();status("Câmera fechada.");};
el("photo").onchange=async()=>{
  const file=el("photo").files[0];el("photo").value="";
  if(!file||busy)return;
  busy=true;const token=++geracao;el("start").disabled=true;
  el("id").value="";el("result").textContent="";
  const url=URL.createObjectURL(file);
  try{
    status("Lendo a foto...");
    const img=new Image();img.src=url;await img.decode();
    const w=await obterWorker();
    await w.setParameters({tessedit_pageseg_mode:"6"});
    let data;
    try {({data}=await w.recognize(quadro(img,false)));}
    finally{await w.setParameters({tessedit_pageseg_mode:"7"});}
    if(token!==geracao)return;
    const id=extrairId(data.text);
    if(id)aceitar(id);
    else status("ID não identificado. Fotografe apenas a primeira linha ou digite manualmente.");
  }catch(e){status("Não foi possível ler a foto: "+e.message);}
  finally{URL.revokeObjectURL(url);busy=false;el("start").disabled=false;}
};
window.addEventListener("pagehide",encerrar);
</script></html>
