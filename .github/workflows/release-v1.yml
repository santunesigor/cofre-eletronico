name: Release v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create v1.0.0 --target 7372c6d912b558b9b6cd662eedd40c8d0761ed28 --title "v1.0.0" --notes "Firmware Arduino Uno com Timer2, servo, LCD I2C e dois bipes de abertura."
          fi
