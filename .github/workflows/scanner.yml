name: Preparar scanner do LCD
on:
  push:
    branches: [main]
    paths: ['recuperacao.html','package.json','scripts/prepare-ocr.cjs','tests/test_scanner.cjs','.github/workflows/scanner.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar no GitHub Pages (habilite a origem GitHub Actions nas configurações)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:scanner
      - run: npm run prepare:ocr
      - uses: actions/upload-artifact@v4
        with:
          name: calculador-com-scanner
          path: |
            recuperacao.html
            ocr/
      - name: Preparar site estático
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        run: |
          mkdir -p public
          cp recuperacao.html public/index.html
          cp -r ocr public/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        with:
          path: public
  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    needs: scanner
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
